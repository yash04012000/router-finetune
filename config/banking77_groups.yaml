# How the 77 original Banking77 labels are merged into our 15 banking intents.
# (The 16th intent, out_of_scope, comes from CLINC150 - see scripts/build_dataset.py.)
#
# Why merge? 77 classes with ~130 examples each is a harder, noisier problem than we want for
# learning. Merging related labels gives ~15 classes with plenty of examples, AND the groups that
# sit next to each other (e.g. transfers vs transfer_problem) are exactly the confusable pairs
# the error analysis in PRD 6 will look at.
#
# build_dataset.py checks that every one of the 77 original labels appears exactly once below.

groups:
  card_ordering:
    - order_physical_card
    - get_physical_card
    - getting_spare_card
    - getting_virtual_card
    - get_disposable_virtual_card
    - disposable_card_limits
    - card_about_to_expire

  card_delivery_activation:
    - card_arrival
    - card_delivery_estimate
    - activate_my_card
    - card_linking

  card_problem:
    - card_not_working
    - contactless_not_working
    - virtual_card_not_working

  lost_stolen_security:
    - lost_or_stolen_card
    - lost_or_stolen_phone
    - compromised_card

  pin_passcode:
    - change_pin
    - pin_blocked
    - passcode_forgotten

  identity_verification:
    - unable_to_verify_identity
    - verify_my_identity
    - why_verify_identity
    - verify_source_of_funds

  account_management:
    - edit_personal_details
    - terminate_account
    - age_limit

  top_up:
    - top_up_by_bank_transfer_charge
    - top_up_by_card_charge
    - top_up_by_cash_or_cheque
    - top_up_limits
    - topping_up_by_card
    - automatic_top_up
    - apple_pay_or_google_pay

  top_up_problem:
    - top_up_failed
    - top_up_reverted
    - pending_top_up
    - verify_top_up
    - balance_not_updated_after_cheque_or_cash_deposit

  transfers:
    - transfer_into_account
    - receiving_money
    - transfer_timing
    - beneficiary_not_allowed
    - cancel_transfer
    - transfer_fee_charged

  transfer_problem:
    - declined_transfer
    - failed_transfer
    - pending_transfer
    - transfer_not_received_by_recipient
    - balance_not_updated_after_bank_transfer

  card_payment_problem:
    - declined_card_payment
    - pending_card_payment
    - reverted_card_payment?
    - card_payment_not_recognised
    - card_payment_fee_charged
    - card_payment_wrong_exchange_rate
    - extra_charge_on_statement
    - transaction_charged_twice
    - direct_debit_payment_not_recognised

  refunds:
    - request_refund
    - Refund_not_showing_up

  cash_withdrawal:
    - atm_support
    - declined_cash_withdrawal
    - pending_cash_withdrawal
    - cash_withdrawal_charge
    - cash_withdrawal_not_recognised
    - wrong_amount_of_cash_received
    - wrong_exchange_rate_for_cash_withdrawal
    - card_swallowed

  exchange_and_coverage:
    - exchange_charge
    - exchange_rate
    - exchange_via_app
    - fiat_currency_support
    - supported_cards_and_currencies
    - visa_or_mastercard
    - card_acceptance
    - country_support
