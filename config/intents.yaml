# The 16 intents the router chooses between (15 banking intents + out_of_scope).
#
# description      -> one line shown to the large model in the prompt (PRD 4)
# confusable_with  -> our GUESS of which intents models will mix up. PRD 6 checks the guess
#                     against the real confusion matrix.
#
# The ORDER of this list matters: it is the row/column order of every confusion matrix
# and the class-index order of every trained classifier.
#
# Where the data comes from: see config/banking77_groups.yaml and data/DATACARD.md.

intents:
  - name: card_ordering
    description: Customer wants to order, get, or renew a physical, spare, virtual, or disposable card.
    confusable_with: [card_delivery_activation]

  - name: card_delivery_activation
    description: Customer asks where their card is, when it will arrive, or how to activate or link it.
    confusable_with: [card_ordering, card_problem]

  - name: card_problem
    description: A card, contactless payment, or virtual card is not working.
    confusable_with: [card_delivery_activation, lost_stolen_security]

  - name: lost_stolen_security
    description: Card or phone was lost or stolen, or the card may be compromised.
    confusable_with: [card_problem, pin_passcode]

  - name: pin_passcode
    description: Customer wants to change their PIN, has a blocked PIN, or forgot their passcode.
    confusable_with: [card_problem, lost_stolen_security]

  - name: identity_verification
    description: Questions about verifying identity or source of funds, or failing verification.
    confusable_with: [account_management]

  - name: account_management
    description: Customer wants to edit personal details, close their account, or asks about age limits.
    confusable_with: [identity_verification]

  - name: top_up
    description: Questions about adding money to the account by card, bank transfer, cash, cheque, or Apple/Google Pay.
    confusable_with: [top_up_problem, transfers]

  - name: top_up_problem
    description: A top-up failed, was reverted, is pending, or the balance did not update after a deposit.
    confusable_with: [top_up, transfer_problem]

  - name: transfers
    description: Questions about sending or receiving bank transfers, their timing, fees, or cancelling one.
    confusable_with: [transfer_problem, top_up]

  - name: transfer_problem
    description: A transfer was declined, failed, is pending, or the recipient did not receive the money.
    confusable_with: [transfers, top_up_problem]

  - name: card_payment_problem
    description: A card payment was declined, pending, reverted, charged twice, wrongly charged, or not recognised.
    confusable_with: [refunds, cash_withdrawal]

  - name: refunds
    description: Customer wants a refund or says a refund has not shown up.
    confusable_with: [card_payment_problem]

  - name: cash_withdrawal
    description: Problems or questions about ATM cash withdrawals, fees, wrong amounts, or a swallowed card.
    confusable_with: [card_payment_problem, exchange_and_coverage]

  - name: exchange_and_coverage
    description: Questions about exchange rates and fees, supported currencies, countries, and card types.
    confusable_with: [cash_withdrawal, card_payment_problem]

  - name: out_of_scope
    description: Message is unrelated to banking or customer support (general knowledge, chit-chat, other topics).
    confusable_with: []
